<main class="auth-page">
  <div class="auth-card">
    <a routerLink="/store" class="auth-brand">Calzados José</a>
    <h1 class="auth-title">Crear una cuenta</h1>
    <p class="auth-subtitle">Empecemos. Completá tus datos.</p>

    <form [formGroup]="signInForm" (ngSubmit)="signIn()" novalidate class="auth-form">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <div>
          <label class="label" for="signup-first-name">Nombre</label>
          <input id="signup-first-name" class="input" formControlName="firstName" autocomplete="given-name" [class.is-invalid]="invalid('firstName')" />
          <p *ngIf="invalid('firstName')" class="field-error">Ingresá tu nombre.</p>
        </div>
        <div>
          <label class="label" for="signup-last-name">Apellido</label>
          <input id="signup-last-name" class="input" formControlName="lastName" autocomplete="family-name" [class.is-invalid]="invalid('lastName')" />
          <p *ngIf="invalid('lastName')" class="field-error">Ingresá tu apellido.</p>
        </div>
      </div>

      <div>
        <label class="label" for="signup-email">Correo electrónico</label>
        <input
          id="signup-email"
          type="email"
          class="input"
          formControlName="email"
          autocomplete="email"
          placeholder="tu@correo.com"
          [class.is-invalid]="invalid('email')"
        />
        <p *ngIf="invalid('email')" class="field-error">Ingresá un correo válido.</p>
      </div>

      <div>
        <label class="label" for="signup-password">Contraseña</label>
        <div class="password-field">
          <input
            id="signup-password"
            class="input"
            formControlName="password"
            autocomplete="new-password"
            aria-describedby="password-rules"
            [type]="showPassword ? 'text' : 'password'"
            [class.is-invalid]="invalid('password')"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
          >
            <i class="fa-regular" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
        </div>
        <div id="password-rules" class="password-rules">
          <p>Debe tener:</p>
          <ul>
            <li *ngFor="let rule of passwordRules" [class.met]="rule.met">
              <i class="fa-solid" [class.fa-check]="rule.met" [class.fa-circle]="!rule.met" aria-hidden="true"></i>
              {{ rule.label }}
              <span class="sr-only">{{ rule.met ? '(cumplido)' : '(pendiente)' }}</span>
            </li>
          </ul>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="submitting">
        {{ submitting ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>¿Ya tenés cuenta?</span>
      <a class="link" routerLink="/auth/login">Iniciar sesión</a>
    </div>
  </div>
</main>
