<main class="auth-page">
  <div class="auth-card">
    <a routerLink="/store" class="auth-brand">Calzados José</a>
    <h1 class="auth-title">Iniciar sesión</h1>
    <p class="auth-subtitle">Ingresá con tu correo para pagar tus pedidos.</p>

    <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate class="auth-form">
      <div>
        <label class="label" for="login-email">Correo electrónico</label>
        <input
          id="login-email"
          type="email"
          class="input"
          formControlName="email"
          autocomplete="email"
          placeholder="Ingresá tu correo electrónico"
          [class.is-invalid]="invalid('email')"
        />
        <p *ngIf="invalid('email')" class="field-error">Ingresá un correo válido.</p>
      </div>

      <div>
        <label class="label" for="login-password">Contraseña</label>
        <div class="password-field">
          <input
            id="login-password"
            class="input"
            formControlName="password"
            autocomplete="current-password"
            [type]="showPassword ? 'text' : 'password'"
            [class.is-invalid]="invalid('password')"
          />
          <button
            type="button"
            class="password-toggle"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword"
            (click)="showPassword = !showPassword"
          >
            <i class="fa-regular" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
        </div>
        <p *ngIf="invalid('password')" class="field-error">La contraseña tiene al menos 6 caracteres.</p>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="submitting">
        {{ submitting ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>¿No tenés cuenta?</span>
      <a class="link" routerLink="/auth/sign-in">Registrarse</a>
    </div>
  </div>
</main>
