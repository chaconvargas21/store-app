  <nav class="bg-white text-ink uppercase shadow-sm sticky z-50 top-0">
      <div class="container flex flex-wrap justify-between items-center mx-auto px-6">
        <a class="flex items-center text-2xl font-semibold tracking-widest2" routerLink="/store">
          <span class="py-4"> Cursed </span>
        </a>
        <div class="flex items-center text-xs font-medium tracking-widest2">
          <div class="group">
            <a class="mx-3 py-2 hover:border-b hover:border-b-ink border-b border-b-transparent transition-colors" routerLink="/store/collections/shop"><span>tienda</span></a>
          </div>
          <div class="group">
            <a class="mx-3 py-2 hover:border-b hover:border-b-ink border-b border-b-transparent transition-colors" routerLink="/store/pages/collection"><span>colecciones</span></a>
            <div class="group-hover:block absolute hidden z-50 py-4 bg-white rounded divide-y divide-gray-100 shadow">
              <ul class="py-1 text-gray-700">
                <li *ngFor="let collection of collections">
                  <a class="block py-2 px-4 hover:bg-gray-100" routerLink="/store/collections/shop" [queryParams]="{ categoria: collection.slug }">{{ collection.label }}</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="group">
            <a class="mx-3 py-2 hover:border-b hover:border-b-ink border-b border-b-transparent transition-colors" routerLink="/store/collections/shop"><span>categorías</span></a>
            <div class="group-hover:block absolute hidden z-50 py-4 bg-white rounded divide-y divide-gray-100 shadow">
              <ul class="py-1 text-gray-700">
                <li *ngFor="let category of categories">
                  <a class="block py-2 px-4 hover:bg-gray-100" routerLink="/store/collections/shop" [queryParams]="{ categoria: category.slug }">{{ category.label }}</a>
                </li>
                <li>
                  <a class="block py-2 px-4 hover:bg-gray-100" routerLink="/store/collections/shop">Ver todo</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="group">
            <span class="mx-3 py-2 cursor-default">explorar</span>
            <div class="group-hover:block absolute hidden z-50 py-4 bg-white rounded divide-y divide-gray-100 shadow">
              <ul class="py-1 text-gray-700">
                <li><a class="block py-2 px-4 hover:bg-gray-100" routerLink="/auth/login">Mi cuenta</a></li>
                <li><a class="block py-2 px-4 hover:bg-gray-100" routerLink="/store" fragment="contacto">Contacto</a></li>
                <li><a class="block py-2 px-4 hover:bg-gray-100" routerLink="/store" fragment="newsletter">Newsletter</a></li>
              </ul>
            </div>
          </div>
          <a class="mx-3 py-2 hover:opacity-60 transition-opacity" routerLink="/auth/login" aria-label="Mi cuenta"><i class="fas fa-user"></i></a>
          <div class="relative">
            <button class="mx-3 py-2 hover:opacity-60 transition-opacity" (click)="toggleSearch()" aria-label="Buscar"><i class="fas fa-search"></i></button>
            <input
              *ngIf="showSearch"
              #searchInput
              type="search"
              placeholder="Buscar calzado"
              aria-label="Buscar calzado"
              class="absolute right-0 top-full mt-2 w-64 text-sm normal-case tracking-normal border-gray-300 shadow"
              (keydown.enter)="search(searchInput.value)"
              (keydown.escape)="showSearch = false"
            />
          </div>
          <button class="mx-3 py-2 hover:opacity-60 transition-opacity" (click)="openDialog()" aria-label="Carrito"><i class="fas fa-shopping-cart"></i></button>
          <span class="mx-3 py-2">PEN S/</span>
        </div>
      </div>
    </nav>
