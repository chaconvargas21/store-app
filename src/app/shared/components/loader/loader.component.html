@if (loadingService.loading()) {
  <div class="loader fixed inset-0 z-[2000] flex items-center justify-center bg-white" role="status" aria-live="polite">
    <div class="flex flex-col items-center">
      <span class="text-3xl md:text-4xl font-bold uppercase tracking-widest2 text-ink">Calzados José</span>
      <div class="loader-track mt-6 h-[2px] w-40 overflow-hidden bg-gray-200">
        <div class="loader-bar h-full w-1/3 bg-ink"></div>
      </div>
      <span class="sr-only">Cargando…</span>
    </div>
  </div>
}
