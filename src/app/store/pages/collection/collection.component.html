<div class="container mx-auto px-6 py-16 md:py-24">
  <h1 class="text-2xl font-semibold uppercase tracking-widest2 text-ink mb-12 text-center">
    Colecciones
  </h1>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
    <div *ngFor="let collection of collections">
      <div
        class="image bg-cover bg-center mb-4"
        [style.background-image]="'url(' + collection.image + ')'"
      ></div>
      <p class="text-lg font-semibold uppercase tracking-widest2 text-ink">{{ collection.label }}</p>
      <p class="text-sm font-light text-gray-600 mt-2">
        {{ collection.description }}
      </p>
      <a
        routerLink="/store/collections/shop"
        [queryParams]="{ categoria: collection.slug }"
        class="inline-block bg-transparent text-sm font-medium text-ink border border-ink uppercase tracking-widest2 py-3 px-5 mt-4 hover:bg-ink hover:text-white transition-colors"
      >
        ver colección
      </a>
    </div>
  </div>
</div>
